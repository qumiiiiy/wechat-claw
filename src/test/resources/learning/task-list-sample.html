<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>课程任务 - 学习通</title>
</head>
<body>
    <!-- 正常任务列表 -->
    <div class="task-list">
        <div class="task-item" data-taskid="task-001">
            <div class="task-title">第一章 视频学习</div>
            <div class="task-type">视频</div>
            <div class="task-deadline">2026-08-15 23:59:59</div>
            <div class="task-status">已完成</div>
        </div>
        <div class="task-item" data-taskid="task-002">
            <div class="task-title">第一章 课后作业</div>
            <div class="task-type">作业</div>
            <div class="task-deadline">2026-08-20 23:59:59</div>
            <div class="task-status">未完成</div>
        </div>
        <div class="task-item" data-taskid="task-003">
            <div class="task-title">期中考试</div>
            <div class="task-type">考试</div>
            <div class="task-deadline">2026-09-01 09:00:00</div>
            <div class="task-status">未完成</div>
        </div>
        <div class="task-item" data-taskid="task-004">
            <div class="task-title">课程讨论：计算机发展史</div>
            <div class="task-type">讨论</div>
            <div class="task-deadline">2026-08-25 23:59:59</div>
            <div class="task-status">未完成</div>
        </div>
        <!-- 无截止时间的任务 -->
        <div class="task-item" data-taskid="task-005">
            <div class="task-title">补充阅读材料</div>
            <div class="task-type">其他</div>
            <div class="task-status">已完成</div>
        </div>
        <!-- 无效截止时间 -->
        <div class="task-item" data-taskid="task-006">
            <div class="task-title">历史遗留任务</div>
            <div class="task-type">作业</div>
            <div class="task-deadline">时间已过期</div>
            <div class="task-status">已完成</div>
        </div>
    </div>

    <!-- 重复任务（用于测试去重） -->
    <div class="task-list">
        <div class="task-item" data-taskid="task-001">
            <div class="task-title">第一章 视频学习（重复）</div>
            <div class="task-type">视频</div>
            <div class="task-deadline">2026-08-15 23:59:59</div>
            <div class="task-status">未完成</div>
        </div>
    </div>
</body>
</html>
