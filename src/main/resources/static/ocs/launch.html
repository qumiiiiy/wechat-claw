<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WeChat Claw 学习任务</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
            background: #f3f6fb;
            color: #172033;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
        }
        main {
            width: min(680px, 100%);
            background: #fff;
            border: 1px solid #dce3ef;
            border-radius: 18px;
            box-shadow: 0 18px 55px rgba(34, 52, 84, 0.12);
            padding: 32px;
            box-sizing: border-box;
        }
        h1 { margin: 0 0 8px; font-size: 26px; }
        .subtitle { margin: 0 0 28px; color: #65718a; }
        .hint { color: #65718a; font-size: 14px; line-height: 1.7; }
        a.button {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 16px;
            border-radius: 9px;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
<main>
    <h1>WeChat Claw 学习任务</h1>
    <p class="subtitle">学习任务已在默认浏览器中打开，OCS 插件会自动启动。</p>
    <p class="hint">
        如果伴随脚本未自动连接，请确认 Tampermonkey 中已安装
        <a class="button" href="/ocs/wechat-claw-ocs-bridge.user.js">WeChat Claw OCS Bridge</a>
    </p>
</main>
</body>
</html>
