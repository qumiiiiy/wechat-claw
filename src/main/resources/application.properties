bot.infrastructure.media.dashscope.speech-profile-voice.girl=${BAILIAN_SPEECH_GIRL_VOICE:longhuhu_v3}
bot.infrastructure.media.dashscope.speech-profile-voice.young-male=${BAILIAN_SPEECH_YOUNG_MALE_VOICE:longanlang_v3}
bot.infrastructure.media.dashscope.speech-profile-voice.young-female=${BAILIAN_SPEECH_YOUNG_FEMALE_VOICE:longanhuan}
bot.infrastructure.media.dashscope.speech-profile-voice.mature-male=${BAILIAN_SPEECH_MATURE_MALE_VOICE:longanzhi_v3}
bot.infrastructure.media.dashscope.speech-profile-voice.mature-female=${BAILIAN_SPEECH_MATURE_FEMALE_VOICE:longanya_v3}
bot.infrastructure.media.dashscope.speech-profile-voice.elderly-male=${BAILIAN_SPEECH_ELDERLY_MALE_VOICE:longlaobo_v3}
