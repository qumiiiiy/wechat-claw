bot.infrastructure.media.dashscope.speech-profile-voice.live-stream-female=${BAILIAN_SPEECH_LIVE_STREAM_FEMALE_VOICE:longanxuan_v3}
bot.infrastructure.media.dashscope.speech-profile-voice.robot=${BAILIAN_SPEECH_ROBOT_VOICE:longjiqi_v3}
bot.infrastructure.media.dashscope.speech-profile-voice.monkey-king=${BAILIAN_SPEECH_MONKEY_KING_VOICE:longhouge_v3}
bot.infrastructure.media.dashscope.speech-profile-voice.cantonese-male=${BAILIAN_SPEECH_CANTONESE_MALE_VOICE:longanyue_v3}
bot.infrastructure.media.dashscope.speech-profile-voice.shaanxi-male=${BAILIAN_SPEECH_SHAANXI_MALE_VOICE:longshange_v3}
bot.infrastructure.media.dashscope.speech-profile-voice.minnan-female=${BAILIAN_SPEECH_MINNAN_FEMALE_VOICE:longanmin_v3}
bot.infrastructure.media.dashscope.speech-format=${BAILIAN_SPEECH_FORMAT:mp3}
bot.infrastructure.media.dashscope.speech-sample-rate=${BAILIAN_SPEECH_SAMPLE_RATE:24000}
bot.infrastructure.media.dashscope.speech-volume=${BAILIAN_SPEECH_VOLUME:50}
bot.infrastructure.media.dashscope.speech-rate=${BAILIAN_SPEECH_RATE:1.0}
bot.infrastructure.media.dashscope.speech-pitch=${BAILIAN_SPEECH_PITCH:1.0}
bot.infrastructure.media.dashscope.speech-max-characters=${BAILIAN_SPEECH_MAX_CHARACTERS:2000}
bot.infrastructure.media.dashscope.max-download-bytes=${BAILIAN_MEDIA_MAX_DOWNLOAD_BYTES:20971520}
bot.infrastructure.media.dashscope.max-concurrent-requests=${BAILIAN_MEDIA_MAX_CONCURRENT_REQUESTS:2}
bot.infrastructure.media.dashscope.connect-timeout=${BAILIAN_MEDIA_CONNECT_TIMEOUT:15s}
bot.infrastructure.media.dashscope.request-timeout=${BAILIAN_MEDIA_REQUEST_TIMEOUT:3m}
bot.infrastructure.media.dashscope.ffmpeg-executable=${FFMPEG_EXECUTABLE:ffmpeg}
bot.infrastructure.media.dashscope.ffprobe-executable=${FFPROBE_EXECUTABLE:ffprobe}
bot.infrastructure.media.dashscope.conversion-timeout=${FFMPEG_CONVERSION_TIMEOUT:2m}
bot.infrastructure.media.dashscope.video-width=${BAILIAN_SPEECH_VIDEO_WIDTH:640}
bot.infrastructure.media.dashscope.video-height=${BAILIAN_SPEECH_VIDEO_HEIGHT:360}

# Conversation memory defaults to SQLite. Set BOT_MEMORY_TYPE=memory for ephemeral local runs.
bot.persistence.conversation.type=${BOT_MEMORY_TYPE:sqlite}
bot.persistence.conversation.retained-messages=${BOT_MEMORY_RETAINED_MESSAGES:100}
bot.persistence.conversation.max-message-characters=${BOT_MEMORY_MAX_MESSAGE_CHARACTERS:50000}
bot.persistence.conversation.expire-after=${BOT_MEMORY_EXPIRE_AFTER:0s}
bot.persistence.conversation.sqlite.jdbc-url=${SQLITE_JDBC_URL:jdbc:sqlite:./data/wechat-bot.db}
bot.persistence.conversation.sqlite.busy-timeout-millis=${SQLITE_BUSY_TIMEOUT_MILLIS:5000}
bot.persistence.conversation.sqlite.connection-timeout=${SQLITE_CONNECTION_TIMEOUT:10s}
bot.persistence.conversation.sqlite.validation-timeout=${SQLITE_VALIDATION_TIMEOUT:5s}
bot.persistence.inbound-message.deduplication-ttl=${WECHAT_MESSAGE_DEDUPLICATION_TTL:3d}
bot.persistence.inbound-message.max-error-characters=${WECHAT_MESSAGE_LEDGER_MAX_ERROR_CHARACTERS:256}

# QWeather Web API. Use the API Host assigned in QWeather Console and keep the key in the environment.
bot.infrastructure.weather.qweather.enabled=${WEATHER_ENABLED:true}
bot.infrastructure.weather.qweather.api-host=${QWEATHER_API_HOST:https://devapi.qweather.com}
bot.infrastructure.weather.qweather.api-key=${QWEATHER_API_KEY:}
bot.infrastructure.weather.qweather.language=${QWEATHER_LANGUAGE:zh}
bot.infrastructure.weather.qweather.unit=${QWEATHER_UNIT:m}
bot.infrastructure.weather.qweather.connect-timeout=${QWEATHER_CONNECT_TIMEOUT:10s}
bot.infrastructure.weather.qweather.request-timeout=${QWEATHER_REQUEST_TIMEOUT:15s}

# Emotional companion profile memory. Profiles persist key user context across
# sessions so the agent remembers important facts beyond the history window.
bot.capability.profile.enabled=${BOT_PROFILE_ENABLED:true}
bot.capability.profile.ttl=${BOT_PROFILE_TTL:30d}
bot.capability.profile.max-profile-characters=${BOT_PROFILE_MAX_CHARACTERS:2000}
bot.capability.profile.max-profiles=${BOT_PROFILE_MAX_PROFILES:100}
bot.capability.profile.care-enabled=${BOT_PROFILE_CARE_ENABLED:true}

# PlantUML diagram rendering via an external CLI. The master switch is on by default.
# PlantUML itself is GPL-licensed; this module only invokes the CLI as a
# separate process and never links PlantUML classes. Operators must install
# PlantUML on the host themselves and accept its licence.
bot.infrastructure.diagram.enabled=${PLANTUML_ENABLED:true}
bot.infrastructure.diagram.executable=${PLANTUML_EXECUTABLE:plantuml.bat}
bot.infrastructure.diagram.timeout=${PLANTUML_TIMEOUT:90s}
bot.infrastructure.diagram.max-source-characters=${PLANTUML_MAX_SOURCE_CHARACTERS:8000}
bot.infrastructure.diagram.max-output-bytes=${PLANTUML_MAX_OUTPUT_BYTES:7340032}
bot.infrastructure.diagram.allowed-diagram-types=${PLANTUML_ALLOWED_TYPES:sequence,class,flowchart,state,activity,usecase,component,deployment,object,timing,erd,gantt,mindmap,wbs,salt}
bot.infrastructure.diagram.retry-attempts=${PLANTUML_RETRY_ATTEMPTS:3}
bot.infrastructure.diagram.retry-delay=${PLANTUML_RETRY_DELAY:500ms}

# Student todo reminder scanning never sends WeChat messages directly.
bot.agent.todo-reminder.enabled=${BOT_TODO_REMINDER_ENABLED:true}

# Local file search. '*' means every mounted file-system root; explicit paths can still be
# supplied through BOT_FILE_BROWSE_ALLOWED_PATHS for a narrower deployment.
bot.capability.file-browse.enabled=${BOT_FILE_BROWSE_ENABLED:true}
bot.capability.file-browse.allowed-paths=${BOT_FILE_BROWSE_ALLOWED_PATHS:*}
bot.capability.file-browse.max-depth=${BOT_FILE_BROWSE_MAX_DEPTH:8}
bot.capability.file-browse.max-results=${BOT_FILE_BROWSE_MAX_RESULTS:50}
bot.capability.file-browse.max-keyword-length=${BOT_FILE_BROWSE_MAX_KEYWORD_LENGTH:50}
bot.capability.file-browse.max-entries=${BOT_FILE_BROWSE_MAX_ENTRIES:500}
bot.capability.file-browse.max-scan-duration=${BOT_FILE_BROWSE_MAX_SCAN_DURATION:2s}
bot.capability.file-browse.selection-expire-after=${BOT_FILE_BROWSE_SELECTION_EXPIRE_AFTER:10m}
bot.capability.file-browse.max-selections=${BOT_FILE_BROWSE_MAX_SELECTIONS:500}
bot.capability.file-browse.max-file-bytes=${BOT_FILE_BROWSE_MAX_FILE_BYTES:10485760}
bot.capability.file-browse.allowed-extensions=${BOT_FILE_BROWSE_ALLOWED_EXTENSIONS:txt,md,pdf,doc,docx,xls,xlsx,csv,json,ppt,pptx,png,jpg,jpeg}

# Bounded code workspace. By default it is limited to the process working directory and the
# fixed Maven Wrapper test command; operators can narrow or replace both through environment.
bot.infrastructure.code-workspace.enabled=${BOT_CODE_WORKSPACE_ENABLED:true}
bot.infrastructure.code-workspace.allowed-repositories=${BOT_CODE_WORKSPACE_ALLOWED_REPOSITORIES:${user.dir:.}}
bot.infrastructure.code-workspace.max-search-results=${BOT_CODE_WORKSPACE_MAX_SEARCH_RESULTS:20}
bot.infrastructure.code-workspace.max-search-depth=${BOT_CODE_WORKSPACE_MAX_SEARCH_DEPTH:5}
bot.infrastructure.code-workspace.max-read-lines=${BOT_CODE_WORKSPACE_MAX_READ_LINES:100}
bot.infrastructure.code-workspace.max-read-bytes=${BOT_CODE_WORKSPACE_MAX_READ_BYTES:10000}
bot.infrastructure.code-workspace.max-diff-lines=${BOT_CODE_WORKSPACE_MAX_DIFF_LINES:500}
bot.infrastructure.code-workspace.max-patch-bytes=${BOT_CODE_WORKSPACE_MAX_PATCH_BYTES:50000}
bot.infrastructure.code-workspace.max-patch-hunks=${BOT_CODE_WORKSPACE_MAX_PATCH_HUNKS:20}
bot.infrastructure.code-workspace.patch-confirm-ttl=${BOT_CODE_WORKSPACE_PATCH_CONFIRM_TTL:5m}
bot.infrastructure.code-workspace.max-pending-confirmations=${BOT_CODE_WORKSPACE_MAX_CONFIRMATIONS:50}
bot.infrastructure.code-workspace.test-command=${BOT_CODE_WORKSPACE_TEST_COMMAND:mvnw.cmd test}
bot.infrastructure.code-workspace.test-timeout=${BOT_CODE_WORKSPACE_TEST_TIMEOUT:30s}

# 学习通课程采集
bot.infrastructure.learning.enabled=${CHAOXING_ENABLED:true}
bot.infrastructure.learning.base-url=${CHAOXING_BASE_URL:https://mooc1.chaoxing.com}
bot.infrastructure.learning.passport-url=${CHAOXING_PASSPORT_URL:https://passport2.chaoxing.com}
bot.infrastructure.learning.cookie=${CHAOXING_COOKIE:}
bot.infrastructure.learning.uid=${CHAOXING_UID:}
bot.infrastructure.learning.connect-timeout=${CHAOXING_CONNECT_TIMEOUT:10s}
bot.infrastructure.learning.request-timeout=${CHAOXING_REQUEST_TIMEOUT:30s}
bot.infrastructure.learning.login-challenge-timeout=${CHAOXING_LOGIN_CHALLENGE_TIMEOUT:3m}

# Loopback bridge for a separately installed OCS userscript.
# A non-secret custom request header blocks ordinary browser cross-site requests.
# Never enable CORS for this API or expose it beyond loopback.
# Conversation and URL-host lists are optional compatibility hardening, not enablement requirements.
bot.capability.learning.ocs.enabled=${BOT_OCS_ENABLED:true}
bot.capability.learning.ocs.chaoxing-start-url=${BOT_OCS_CHAOXING_START_URL:https://mooc1.chaoxing.com/mycourse}
bot.capability.learning.ocs.launch-page-url=${BOT_OCS_LAUNCH_PAGE_URL:http://127.0.0.1:8080/ocs/launch.html}
bot.capability.learning.ocs.allowed-conversation-list=${BOT_OCS_ALLOWED_CONVERSATIONS:}
bot.capability.learning.ocs.allowed-url-host-list=${BOT_OCS_ALLOWED_URL_HOSTS:}
bot.capability.learning.ocs.max-sessions=${BOT_OCS_MAX_SESSIONS:20}
bot.capability.learning.ocs.max-answer-attempts-per-session=${BOT_OCS_MAX_ANSWER_ATTEMPTS_PER_SESSION:200}
bot.capability.learning.ocs.max-event-characters=${BOT_OCS_MAX_EVENT_CHARACTERS:4000}
bot.capability.learning.ocs.max-notes-characters=${BOT_OCS_MAX_NOTES_CHARACTERS:20000}
bot.capability.learning.ocs.session-expire-after=${BOT_OCS_SESSION_EXPIRE_AFTER:12h}
bot.capability.learning.ocs.command-lease-duration=${BOT_OCS_COMMAND_LEASE_DURATION:30s}
bot.capability.learning.ocs.plugin-detection-timeout=${BOT_OCS_PLUGIN_DETECTION_TIMEOUT:10s}
bot.capability.learning.ocs.plugin-version-min=${BOT_OCS_PLUGIN_VERSION_MIN:0.6.7}
bot.capability.learning.ocs.ocs-config-video-review=${BOT_OCS_CONFIG_VIDEO_REVIEW:true}
bot.capability.learning.ocs.ocs-config-auto-chapter-switch=${BOT_OCS_CONFIG_AUTO_CHAPTER_SWITCH:true}
bot.capability.learning.ocs.ocs-config-playback-rate=${BOT_OCS_CONFIG_PLAYBACK_RATE:1}
bot.capability.learning.ocs.ocs-config-answer-enabled=${BOT_OCS_CONFIG_ANSWER_ENABLED:true}
bot.capability.learning.ocs.ocs-config-question-bank-url=${BOT_OCS_CONFIG_QUESTION_BANK_URL:http://127.0.0.1:8080/api/local/ocs/questions/answer}
bot.capability.learning.ocs.login-qr-relay-enabled=${BOT_OCS_LOGIN_QR_RELAY_ENABLED:true}
bot.capability.learning.ocs.login-qr-timeout=${BOT_OCS_LOGIN_QR_TIMEOUT:120s}

# Online OCS answer source backed by the existing AgentModelClient/DashScope configuration.
bot.agent.ocs-answer.enabled=${BOT_OCS_AI_ANSWER_ENABLED:true}
bot.agent.ocs-answer.minimum-confidence=${BOT_OCS_AI_MINIMUM_CONFIDENCE:0.7}
bot.agent.ocs-answer.request-timeout=${BOT_OCS_AI_REQUEST_TIMEOUT:35s}
bot.agent.ocs-answer.max-concurrent-answers=${BOT_OCS_AI_MAX_CONCURRENT_ANSWERS:2}
bot.agent.ocs-answer.queue-capacity=${BOT_OCS_AI_QUEUE_CAPACITY:4}
