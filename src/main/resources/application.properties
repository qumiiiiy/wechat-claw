spring.application.name=wechat-ilink-bot
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never

bot.channel.wechat.enabled=${WECHAT_ILINK_ENABLED:true}
bot.channel.wechat.auto-open-login-page=${WECHAT_AUTO_OPEN_LOGIN_PAGE:true}
bot.channel.wechat.auto-reply-enabled=${WECHAT_ILINK_AUTO_REPLY_ENABLED:true}
bot.channel.wechat.auto-reply-file-threshold-characters=${WECHAT_AUTO_REPLY_FILE_THRESHOLD_CHARACTERS:1500}
bot.channel.wechat.max-pending-replies=${WECHAT_MAX_PENDING_REPLIES:1000}
bot.channel.wechat.max-pending-reply-characters=${WECHAT_MAX_PENDING_REPLY_CHARACTERS:500}
bot.channel.wechat.poll-interval=${WECHAT_ILINK_POLL_INTERVAL:1s}
bot.channel.wechat.poll-failure-delay=${WECHAT_ILINK_POLL_FAILURE_DELAY:5s}
bot.channel.wechat.login-timeout=${WECHAT_ILINK_LOGIN_TIMEOUT:3m}
bot.channel.wechat.connect-timeout=${WECHAT_ILINK_CONNECT_TIMEOUT:35s}
bot.channel.wechat.read-timeout=${WECHAT_ILINK_READ_TIMEOUT:40s}
bot.channel.wechat.write-timeout=${WECHAT_ILINK_WRITE_TIMEOUT:35s}
bot.channel.wechat.qr-code-size=${WECHAT_ILINK_QR_CODE_SIZE:360}
bot.channel.wechat.max-bot-sessions=${WECHAT_ILINK_MAX_BOT_SESSIONS:20}
bot.channel.wechat.message-handling-core-threads=${WECHAT_MESSAGE_CORE_THREADS:2}
bot.channel.wechat.message-handling-max-threads=${WECHAT_MESSAGE_MAX_THREADS:16}
bot.channel.wechat.message-handling-queue-capacity=${WECHAT_MESSAGE_QUEUE_CAPACITY:256}
bot.channel.wechat.message-retry-max-attempts=${WECHAT_MESSAGE_RETRY_MAX_ATTEMPTS:5}
bot.channel.wechat.message-retry-initial-delay=${WECHAT_MESSAGE_RETRY_INITIAL_DELAY:2s}
bot.channel.wechat.message-retry-max-delay=${WECHAT_MESSAGE_RETRY_MAX_DELAY:5m}
bot.channel.wechat.message-processing-lease=${WECHAT_MESSAGE_PROCESSING_LEASE:5m}
bot.channel.wechat.worker-keep-alive=${WECHAT_WORKER_KEEP_ALIVE:60s}
bot.channel.wechat.channel-version=${WECHAT_ILINK_CHANNEL_VERSION:1.0.0}
bot.channel.wechat.media-download-enabled=${WECHAT_ILINK_MEDIA_DOWNLOAD_ENABLED:true}
bot.channel.wechat.media-download-directory=${WECHAT_ILINK_MEDIA_DOWNLOAD_DIRECTORY:downloads/wechat}

# When the iLink image CDN endpoint keeps returning HTTP 500, force every
# image-kind media through the file CDN path. Off by default. PlantUML
# diagrams are always routed through sendFile() based on filename prefix
# because the iLink image CDN has been observed to fail with HTTP 500 on
# small, structured PNGs; this flag only governs every other image source
# (e.g. qwen-image outputs).
bot.channel.wechat.deliver-images-as-files=false

# Shared admission control, independent of channel SDK details.
bot.infrastructure.rate-limit.enabled=${WECHAT_RATE_LIMIT_ENABLED:true}
bot.infrastructure.rate-limit.requests-per-conversation-per-minute=${WECHAT_USER_REQUESTS_PER_MINUTE:20}
bot.infrastructure.rate-limit.global-requests-per-minute=${WECHAT_GLOBAL_REQUESTS_PER_MINUTE:200}

# DashScope is the only model and media SDK.
bot.agent.history-messages=${BOT_HISTORY_MESSAGES:${QWEN_HISTORY_MESSAGES:12}}
bot.agent.max-history-characters=${BOT_MAX_HISTORY_CHARACTERS:40000}
bot.agent.context-summary-max-characters=${BOT_CONTEXT_SUMMARY_MAX_CHARACTERS:4000}
bot.agent.context-compression-keep-messages=${BOT_CONTEXT_COMPRESSION_KEEP_MESSAGES:6}
bot.agent.max-tool-rounds=${BOT_MAX_TOOL_ROUNDS:${QWEN_MAX_TOOL_ROUNDS:3}}
bot.agent.max-run-duration=${BOT_AGENT_MAX_RUN_DURATION:2m}
bot.agent.max-tool-result-characters=${BOT_AGENT_MAX_TOOL_RESULT_CHARACTERS:20000}
bot.agent.max-concurrent-runs=${BOT_MAX_CONCURRENT_REQUESTS:${QWEN_MAX_CONCURRENT_REQUESTS:4}}
bot.agent.max-media-bytes=${BOT_MAX_MEDIA_BYTES:${QWEN_MAX_MEDIA_BYTES:7340032}}
bot.agent.reference-expire-after=${BOT_AGENT_REFERENCE_EXPIRE_AFTER:30m}
bot.agent.max-conversation-references=${BOT_AGENT_MAX_CONVERSATION_REFERENCES:100}
bot.capability.document.max-characters=${BOT_MAX_DOCUMENT_CHARACTERS:${QWEN_MAX_DOCUMENT_CHARACTERS:30000}}
bot.capability.document.max-bytes=${BOT_MAX_DOCUMENT_BYTES:${QWEN_MAX_DOCUMENT_BYTES:10485760}}
bot.persistence.generated-image.enabled=${BOT_GENERATED_IMAGE_MEMORY_ENABLED:true}
bot.persistence.generated-image.expire-after=${BOT_GENERATED_IMAGE_MEMORY_EXPIRE_AFTER:30m}
bot.persistence.generated-image.max-conversations=${BOT_GENERATED_IMAGE_MEMORY_MAX_CONVERSATIONS:50}
bot.persistence.generated-image.max-image-bytes=${BOT_GENERATED_IMAGE_MEMORY_MAX_IMAGE_BYTES:7340032}
bot.persistence.generated-image.max-total-bytes=${BOT_GENERATED_IMAGE_MEMORY_MAX_TOTAL_BYTES:67108864}
bot.persistence.generated-file.enabled=${BOT_GENERATED_FILE_MEMORY_ENABLED:true}
bot.persistence.generated-file.expire-after=${BOT_GENERATED_FILE_MEMORY_EXPIRE_AFTER:30m}
bot.persistence.generated-file.max-conversations=${BOT_GENERATED_FILE_MEMORY_MAX_CONVERSATIONS:50}
bot.persistence.generated-file.max-file-bytes=${BOT_GENERATED_FILE_MEMORY_MAX_FILE_BYTES:10485760}
bot.persistence.generated-file.max-total-bytes=${BOT_GENERATED_FILE_MEMORY_MAX_TOTAL_BYTES:67108864}

# Bounded UTF-8 file generation; never writes to the server filesystem.
bot.capability.text-file.enabled=${BOT_TEXT_FILE_ENABLED:true}
bot.capability.text-file.max-file-name-characters=${BOT_TEXT_FILE_MAX_NAME_CHARACTERS:100}
bot.capability.text-file.max-content-characters=${BOT_TEXT_FILE_MAX_CHARACTERS:50000}
bot.capability.text-file.max-content-bytes=${BOT_TEXT_FILE_MAX_BYTES:1048576}

# Bounded XLSX generation. The model cannot select the output path.
bot.infrastructure.spreadsheet.enabled=${BOT_SPREADSHEET_ENABLED:true}
bot.infrastructure.spreadsheet.output-directory=${BOT_SPREADSHEET_OUTPUT_DIRECTORY:generated/spreadsheet}

# Bounded PPTX generation. The agent accepts only a natural outline;
# the server owns the output directory and generated file name.
bot.infrastructure.pptx.enabled=${BOT_PPTX_ENABLED:true}
bot.infrastructure.pptx.output-directory=${BOT_PPTX_OUTPUT_DIRECTORY:generated/pptx}
bot.infrastructure.pptx.max-slides=${BOT_PPTX_MAX_SLIDES:32}
bot.infrastructure.pptx.max-bullets=${BOT_PPTX_MAX_BULLETS:12}
bot.infrastructure.pptx.max-table-rows=${BOT_PPTX_MAX_TABLE_ROWS:32}
bot.infrastructure.pptx.max-table-columns=${BOT_PPTX_MAX_TABLE_COLUMNS:12}
bot.infrastructure.pptx.max-output-bytes=${BOT_PPTX_MAX_OUTPUT_BYTES:10485760}
bot.infrastructure.pptx.max-text-characters=${BOT_PPTX_MAX_TEXT_CHARACTERS:4096}
bot.infrastructure.pptx.write-timeout=${BOT_PPTX_WRITE_TIMEOUT:30s}

# Local desktop task execution. The Bot must run on the interactive Windows desktop.
# Also start Java with -Djava.awt.headless=false; Spring Boot otherwise disables java.awt.Desktop.
# Any trusted inbound WeChat conversation may create a task for a validated HTTPS URL.
# The two allowlists are optional compatibility hardening; leave them empty for the self-hosted default.
bot.capability.desktop.enabled=${BOT_DESKTOP_ENABLED:true}
bot.capability.desktop.allowed-conversation-list=${BOT_DESKTOP_ALLOWED_CONVERSATIONS:}
bot.capability.desktop.allowed-url-host-list=${BOT_DESKTOP_ALLOWED_URL_HOSTS:}
bot.capability.desktop.approval-expire-after=${BOT_DESKTOP_APPROVAL_EXPIRE_AFTER:5m}

# QQ SMTP plain-text email. Authorization code is read only from the environment.
bot.infrastructure.mail.qq.enabled=${BOT_EMAIL_ENABLED:false}
bot.infrastructure.mail.qq.sender-address=${QQ_EMAIL_ADDRESS:}
bot.infrastructure.mail.qq.authorization-code=${QQ_SMTP_IMAP:}
bot.infrastructure.mail.qq.allowed-conversation-list=${BOT_EMAIL_ALLOWED_CONVERSATIONS:}
bot.infrastructure.mail.qq.allowed-recipient-list=${BOT_EMAIL_ALLOWED_RECIPIENTS:}
bot.infrastructure.mail.qq.max-recipients=${BOT_EMAIL_MAX_RECIPIENTS:3}
bot.infrastructure.mail.qq.max-subject-characters=${BOT_EMAIL_MAX_SUBJECT_CHARACTERS:100}
bot.infrastructure.mail.qq.max-body-characters=${BOT_EMAIL_MAX_BODY_CHARACTERS:10000}
bot.infrastructure.mail.qq.approval-expire-after=${BOT_EMAIL_APPROVAL_EXPIRE_AFTER:30m}
bot.infrastructure.mail.qq.max-pending-approvals=${BOT_EMAIL_MAX_PENDING_APPROVALS:100}
bot.infrastructure.mail.qq.max-emails-per-conversation-per-hour=${BOT_EMAIL_MAX_PER_CONVERSATION_PER_HOUR:3}
bot.infrastructure.mail.qq.max-emails-per-hour=${BOT_EMAIL_MAX_PER_HOUR:20}
bot.infrastructure.mail.qq.connect-timeout=${BOT_EMAIL_CONNECT_TIMEOUT:10s}
bot.infrastructure.mail.qq.read-timeout=${BOT_EMAIL_READ_TIMEOUT:20s}
bot.infrastructure.mail.qq.write-timeout=${BOT_EMAIL_WRITE_TIMEOUT:20s}

# Official DashScope Java SDK adapter. Never put a real key in this file.
bot.infrastructure.ai.dashscope.enabled=${QWEN_ENABLED:true}
bot.infrastructure.ai.dashscope.api-key=${DASHSCOPE_API_KEY:}
bot.infrastructure.ai.dashscope.base-url=${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
bot.infrastructure.ai.dashscope.model=${QWEN_MODEL:qwen3.7-flash}
bot.infrastructure.ai.dashscope.temperature=${QWEN_TEMPERATURE:0.7}
bot.infrastructure.ai.dashscope.max-completion-tokens=${QWEN_MAX_COMPLETION_TOKENS:1200}
bot.infrastructure.ai.dashscope.max-attempts=${BOT_MODEL_RETRY_MAX_ATTEMPTS:3}
bot.infrastructure.ai.dashscope.connect-timeout=${QWEN_CONNECT_TIMEOUT:15s}
bot.infrastructure.ai.dashscope.request-timeout=${QWEN_REQUEST_TIMEOUT:2m}

# Model-backed email action classification. Semantic judgment uses the same DashScope
# client; the deterministic rule classifier remains the fallback when unavailable.
bot.infrastructure.ai.email-classification.enabled=${BOT_EMAIL_MODEL_CLASSIFICATION_ENABLED:true}
bot.infrastructure.ai.email-classification.request-timeout=${BOT_EMAIL_MODEL_CLASSIFICATION_TIMEOUT:15s}
bot.infrastructure.ai.email-classification.max-concurrent-requests=${BOT_EMAIL_MODEL_CLASSIFICATION_MAX_CONCURRENT:2}
bot.infrastructure.ai.email-classification.queue-capacity=${BOT_EMAIL_MODEL_CLASSIFICATION_QUEUE:4}
bot.infrastructure.ai.email-classification.max-subjects-per-batch=${BOT_EMAIL_MODEL_CLASSIFICATION_MAX_BATCH:50}
bot.infrastructure.ai.email-classification.max-subject-characters=${BOT_EMAIL_MODEL_CLASSIFICATION_MAX_SUBJECT_CHARACTERS:200}

# DashScope image generation and non-real-time CosyVoice synthesis.
# For production, set BAILIAN_BASE_URL to the workspace-specific Beijing /api/v1 URL.
bot.infrastructure.media.dashscope.enabled=${BAILIAN_MEDIA_ENABLED:true}
bot.infrastructure.media.dashscope.api-key=${DASHSCOPE_API_KEY:}
bot.infrastructure.media.dashscope.base-url=${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
bot.infrastructure.media.dashscope.speech-web-socket-url=${BAILIAN_SPEECH_WEBSOCKET_URL:wss://dashscope.aliyuncs.com/api-ws/v1/inference}
bot.infrastructure.media.dashscope.image-enabled=${BAILIAN_IMAGE_ENABLED:true}
bot.infrastructure.media.dashscope.image-model=${BAILIAN_IMAGE_MODEL:qwen-image-2.0}
bot.infrastructure.media.dashscope.image-size=${BAILIAN_IMAGE_SIZE:1024*1024}
bot.infrastructure.media.dashscope.image-prompt-extend=${BAILIAN_IMAGE_PROMPT_EXTEND:true}
bot.infrastructure.media.dashscope.image-watermark=${BAILIAN_IMAGE_WATERMARK:false}
bot.infrastructure.media.dashscope.image-max-prompt-characters=${BAILIAN_IMAGE_MAX_PROMPT_CHARACTERS:4000}
bot.infrastructure.media.dashscope.speech-enabled=${BAILIAN_SPEECH_ENABLED:true}
bot.infrastructure.media.dashscope.speech-model=${BAILIAN_SPEECH_MODEL:cosyvoice-v3-flash}
bot.infrastructure.media.dashscope.speech-voice=${BAILIAN_SPEECH_VOICE:longanyang}
bot.infrastructure.media.dashscope.speech-male-voice=${BAILIAN_SPEECH_MALE_VOICE:longanyang}
