bot.infrastructure.media.dashscope.speech-profile-voice.gentle-female=${BAILIAN_SPEECH_GENTLE_FEMALE_VOICE:longyingtao_v3}
bot.infrastructure.media.dashscope.speech-profile-voice.warm-male=${BAILIAN_SPEECH_WARM_MALE_VOICE:longanyun_v3}
bot.infrastructure.media.dashscope.speech-profile-voice.intellectual-female=${BAILIAN_SPEECH_INTELLECTUAL_FEMALE_VOICE:longanwen_v3}
bot.infrastructure.media.dashscope.speech-profile-voice.narrator-male=${BAILIAN_SPEECH_NARRATOR_MALE_VOICE:longyichen_v3}
